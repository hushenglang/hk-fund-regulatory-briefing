<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>合规工作台 · 香港基金管理</title><style>
:root{--bg:#f0f3f7;--paper:#fff;--ink:#1d293d;--muted:#7b8798;--line:#e5eaf1;--accent:#385eae}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px}.appbar{height:62px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);gap:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px}.brand-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:8px;background:#253a60;color:#fff}.brand-icon svg{width:17px;height:17px}.department{font-size:11px;font-weight:400;color:var(--muted);border-left:1px solid var(--line);padding-left:13px;margin-left:5px}.workspace-tag{color:#8692a1;font-size:10px;letter-spacing:.07em}.shell{max-width:1240px;margin:0 auto;padding:32px}.toolbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}h1{font-size:23px;line-height:1.4;font-weight:650;letter-spacing:-.02em;margin:0}.intro{font-size:11px;color:var(--muted);margin:6px 0 0}.issue{padding:8px 12px;border:1px solid #dce3ed;border-radius:6px;display:flex;align-items:center;gap:10px;background:#f8fafc;white-space:nowrap}.issue span{font-size:10px;color:var(--muted)}.issue strong{font:500 11px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#53627a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.module{background:var(--paper);border:1px solid #e0e6ee;border-radius:10px;padding:22px;min-width:0;display:flex;flex-direction:column;min-height:345px;box-shadow:0 2px 3px #24364d02}.active{transition:border-color .15s,box-shadow .15s}.active:hover{border-color:#9aafce;box-shadow:0 5px 16px #24364d08}.module-top{display:flex;align-items:center;gap:10px}.module-icon{width:32px;height:32px;border-radius:7px;background:#edf2fa;color:#5475ae;display:grid;place-items:center;flex-shrink:0}.module-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}h2{font-size:14px;font-weight:600;margin:0}.status{font-size:9px;color:#648570;background:#eff6f0;border-radius:4px;padding:2px 6px;margin-left:auto;white-space:nowrap}.metric{display:flex;gap:8px;align-items:baseline;margin:22px 0 0}.metric strong{font-size:40px;font-weight:550;line-height:1.2;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:11px}.metric-note{color:var(--muted);font-size:10px;margin:4px 0 20px}.section-label{color:#94a0b1;font-size:9px;margin:0 0 5px}.highlights{padding:0;margin:0 0 20px;list-style:none}.highlights li{font-size:11px;color:#55647a;border-bottom:1px solid #f0f3f7;padding:9px 0;display:flex;align-items:center;gap:8px;min-width:0}.highlights li::before{content:"";width:3px;height:3px;background:#92a6c3;border-radius:50%;flex-shrink:0}.highlights .headline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.module-footer{border-top:1px solid var(--line);padding-top:14px;margin-top:auto;display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:var(--accent)}.compliance .module-icon{background:#f2f3f6;color:#939eae}.compliance .status{color:#8c96a5;background:#f2f4f7}.compliance .metric strong{color:#c0c8d3;font-weight:400}.empty-state{display:flex;align-items:center;gap:9px;background:#f8f9fb;border-radius:6px;padding:13px 12px;margin:0 0 20px;color:#96a0af;font-size:10px}.empty-state svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;flex-shrink:0}.compliance .module-footer{color:#a4adba;font-weight:400}.workspace-footer{display:flex;justify-content:space-between;gap:15px;padding-top:18px;font-size:10px;color:#8c98a8}.connection{display:flex;align-items:center;gap:6px}.connection::before{content:"";width:5px;height:5px;border-radius:50%;background:#85a48e}@media(max-width:900px){.shell{padding:24px}.appbar{padding:0 24px}.grid{gap:12px}.module{padding:18px}.status{font-size:8px}}@media(max-width:700px){.shell{padding:22px 18px}.appbar{padding:0 18px;height:56px}.department,.workspace-tag{display:none}.toolbar{align-items:flex-start;flex-direction:column;gap:15px;margin-bottom:18px}h1{font-size:21px}.grid{grid-template-columns:1fr;gap:14px}.module{min-height:310px;padding:20px}.module-top{gap:10px}.status{font-size:9px}.metric{margin-top:18px}.metric strong{font-size:36px}.workspace-footer{flex-direction:column;gap:5px}.headline{max-width:100%}}@media(prefers-reduced-motion:reduce){.active{transition:none}}@media print{@page{size:A4 landscape;margin:12mm}body{background:white}.appbar{padding:0;height:42px}.shell{padding:20px 0}.module{box-shadow:none;break-inside:avoid}.highlights .headline{white-space:normal}.module-footer{display:none}}
.compliance.connected .metric strong{color:var(--ink);font-weight:550}.compliance.connected .module-footer{color:var(--accent);font-weight:500}.compliance.connected .status{color:#916c29;background:#fcf6e9}.compliance.connected .module-icon{color:#a1844b;background:#faf5ea}
.daily-panel{background:var(--paper);border:1px solid #e0e6ee;border-radius:10px;margin-top:20px;padding:19px 22px}.daily-header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding-bottom:13px;border-bottom:1px solid var(--line)}.daily-title{display:flex;align-items:center;gap:12px}.daily-title h2{font-size:14px}.daily-title time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.daily-progress{font-size:10px;color:#6f819d;background:#f3f6fa;border-radius:4px;padding:3px 8px}.todo-list{list-style:none;padding:0;margin:0}.todo-row{border-bottom:1px solid #f0f3f7}.todo-row:last-child{border-bottom:0}.todo-row label,.todo-slot{display:flex;align-items:center;gap:15px;padding:11px 0;min-height:43px}.todo-row label{cursor:pointer}.todo-row input{appearance:none;width:15px;height:15px;border:1px solid #cbd5e3;border-radius:4px;margin:0;flex-shrink:0;display:grid;place-content:center;cursor:pointer;background:#fff}.todo-row input:checked{background:#5b79ad;border-color:#5b79ad}.todo-row input:checked::after{content:"";width:7px;height:4px;border-left:1.5px solid white;border-bottom:1.5px solid white;transform:rotate(-45deg) translateY(-1px)}.todo-row input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.todo-time{font-size:11px;min-width:45px;color:#71819a;font-variant-numeric:tabular-nums}.todo-text{font-size:12px;color:#3f506a}.is-done .todo-text{text-decoration:line-through;color:#a4adba}.slot-box{width:15px;height:15px;border:1px dashed #e0e5ed;border-radius:4px;flex-shrink:0}.todo-slot .todo-text{color:#b4bdc9}.daily-note{font-size:9px;color:#98a3b3;margin:9px 0 0}@media(max-width:700px){.daily-panel{padding:16px 20px}.daily-title{gap:8px}.todo-row label,.todo-slot{gap:12px}.todo-text{font-size:12px}.daily-title time{font-size:9px}}
</style></head><body>
